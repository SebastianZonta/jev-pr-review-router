name: jev-pr-review-router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Route review with Jev (advisory only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TypeSafe key. Create at https://console.typesafe.ai/keys then:
          #   gh secret set TYPESAFE_API_KEY --repo <owner>/<repo>
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node src/action.ts
