name: jev-pr-review-router

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Route review with Jev (advisory only, free via OpenCode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free serving (default: jev-1.13-free). Create at https://opencode.ai/console then:
          #   gh secret set OPENCODE_API_KEY --repo <owner>/<repo>
          # OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Or TypeSafe direct (paid). Set these three instead and leave OPENCODE_API_KEY unset:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MODEL: jev-1.14.0
          JEV_BASE_URL: https://api.typesafe.ai
          JEV_MODEL: jev-latest
        run: node src/action.ts
